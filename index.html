<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quiz Rewards</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Replace YOUR_PAYPAL_CLIENT_ID with your PayPal Sandbox / Live Client ID -->
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b14;color:#94a3b8;font-family:sans-serif;">
      Loading…
    </div>
  </div>
  <script type="text/babel" src="app.jsx" data-presets="react"></script>
  <script>
    // If Babel/React fail to load app within 12s, show a clear error
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.innerText.trim() === "Loading…") {
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b14;color:#e2e8f0;font-family:sans-serif;padding:24px;text-align:center;">' +
          '<div><h2 style="margin-bottom:12px;">App failed to load</h2>' +
          '<p style="color:#94a3b8;margin-bottom:8px;">Serve these files over HTTP (not file://).</p>' +
          '<p style="color:#94a3b8;">Example: <code>npx serve .</code> or upload to Netlify / GitHub Pages.</p>' +
          '<p style="color:#94a3b8;margin-top:12px;">Also redeploy <code>code.gs</code> as a new Web App version.</p></div></div>';
      }
    }, 12000);
  </script>
</body>
</html>
